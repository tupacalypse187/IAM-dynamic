# electron-builder packaging for IAM-Dynamic Desktop.
#
# Build flow (see package.json scripts):
#   1. `npm run build` compiles desktop/src -> dist/
#   2. `npm run build:renderer` builds the frontend with VITE_API_BASE_URL
#      baked in (defaults to http://localhost:8000; override per release —
#      file:// has no same-origin fallback, so an unset URL breaks all API
#      calls in the packaged app), then `copy-renderer` stages frontend-dist/
#   3. `electron-builder --mac --arm64` (local) or `--win` (CodeBuild)
#
# Release channel: publishing is NOT configured here so local builds never
# phone home. Release builds (CodeBuild, release tags) pass it on the CLI:
#   electron-builder --win -p always \
#     -c.publish.provider=generic -c.publish.url="$UPDATE_FEED_URL"
# UPDATE_FEED_URL must host the artifacts plus latest.yml / latest-mac.yml.

appId: dev.yantorno.iam-dynamic
productName: IAM Dynamic
copyright: Copyright © 2026 NeuralSec Advisory LLC

directories:
  output: release
  buildResources: build

# App icons live in the per-platform blocks below
# (generated by build/icon.py — never commit binary blobs by hand).

files:
  - dist/**/*
  - frontend-dist/**/*
  - assets/splash.html
  - assets/app-icon.png
  - package.json

extraMetadata:
  main: dist/main/main.js

# macOS: Apple Silicon only. Signed with Developer ID when CSC_NAME is set;
# notarized by scripts/notarize.js when APPLE_ID credentials are present.
mac:
  category: public.app-category.developer-tools
  icon: build/icons/icon.icns
  target:
    - target: dmg
      arch: [arm64]
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false

afterSign: scripts/notarize.js

# Windows: NSIS only until Azure Trusted Signing exists (see docs).
# Unsigned installers will trigger SmartScreen — expected, documented.
# x64 only: keeps CodeBuild minutes (and cost) down; add arm64 if needed.
win:
  icon: build/icons/icon.ico
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: IAM Dynamic

linux:
  category: Development
  icon: build/icons/icon.png
  target:
    - target: AppImage
      arch: [arm64]
    - target: deb
      arch: [arm64]
