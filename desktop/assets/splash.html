<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>IAM Dynamic</title>
<style>
  :root {
    color-scheme: dark;
  }
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  html,
  body {
    height: 100%;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: #0f172a;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    user-select: none;
    -webkit-user-select: none;
  }
  img {
    width: 112px;
    height: 112px;
  }
  h1 {
    font-size: 22px;
    font-weight: 650;
    letter-spacing: 0.01em;
  }
  p {
    font-size: 12.5px;
    color: #94a3b8;
  }
  .bar {
    width: 180px;
    height: 3px;
    border-radius: 9999px;
    background: #1e293b;
    overflow: hidden;
  }
  .bar > div {
    height: 100%;
    width: 40%;
    border-radius: inherit;
    background: #93c5fd;
    animation: slide 1.1s ease-in-out infinite;
  }
  @keyframes slide {
    0% {
      transform: translateX(-100%);
    }
    100% {
      transform: translateX(450%);
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .bar > div {
      animation: none;
      width: 100%;
      transform: none;
    }
  }
</style>
</head>
<body>
  <img src="./app-icon.png" alt="" />
  <h1>IAM Dynamic</h1>
  <p id="version">Starting…</p>
  <div class="bar" aria-hidden="true"><div></div></div>
  <script>
    try {
      var match = /v=([^&]+)/.exec(window.location.hash || '');
      if (match) document.getElementById('version').textContent = 'v' + decodeURIComponent(match[1]);
    } catch (e) {
      /* keep the fallback text */
    }
  </script>
</body>
</html>
