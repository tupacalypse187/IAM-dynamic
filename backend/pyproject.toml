[project]
name = "iam-dynamic-backend"
version = "1.0.0"
description = "IAM-Dynamic Backend - FastAPI with AI-driven IAM policy generation"
requires-python = ">=3.11"
# Keep in sync with backend/requirements.txt (what CI and Docker install).
dependencies = [
    "fastapi>=0.141.0",
    "uvicorn[standard]>=0.52.0",
    "pydantic>=2.13.0",
    "python-dotenv>=1.2.0",
    "boto3>=1.43.0",
    "google-genai>=2.22.0",
    "openai>=3.7.0",
    "anthropic>=1.3.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.32",
    "requests>=2.34.0",
    "PyJWT>=2.13.0",
    "bcrypt>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
# Bare `pytest` (as CI invokes it) does not put the working directory on
# sys.path the way `python -m pytest` does — declare it explicitly so the
# top-level modules (main, config, llm_service) import from backend/.
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
]
