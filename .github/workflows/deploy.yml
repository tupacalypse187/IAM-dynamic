name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/iam-dynamic-frontend
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/iam-dynamic-backend
  CADDY_IMAGE: ghcr.io/${{ github.repository_owner }}/iam-dynamic-caddy

jobs:
  security:
    name: Security & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Frontend checks
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend audit & build
        working-directory: frontend
        run: |
          npm ci
          # Blocking: no known high/critical vulnerabilities may ship
          npm audit --audit-level=high
          npm run lint
          npx tsc -b --noEmit
          npm run build

      # Backend checks
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Backend lint
        working-directory: backend
        run: |
          pip install -r requirements.txt ruff
          ruff check .

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: security
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend build test
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Backend tests
        working-directory: backend
        run: |
          pip install -r requirements.txt pytest
          pytest --tb=short -q

  publish-dockerhub:
    name: Publish to Docker Hub
    runs-on: ubuntu-latest
    needs: [security, test]
    steps:
      - uses: actions/checkout@v6

      # The secrets context is not allowed in a job-level `if`, so gate each
      # publishing step on this output instead. Secrets are passed through
      # env (never interpolated into the script text) and tested in shell.
      # Skipped automatically until DOCKERHUB_USERNAME / DOCKERHUB_TOKEN
      # secrets are configured.
      - name: Check Docker Hub credentials
        id: dockerhub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -n "$DOCKERHUB_USERNAME" && -n "$DOCKERHUB_TOKEN" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v4
        if: steps.dockerhub.outputs.enabled == 'true'

      - name: Log in to Docker Hub
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push frontend
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/iam-dynamic-frontend:latest
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/iam-dynamic-frontend:${{ github.sha }}
          build-args: |
            VITE_TURNSTILE_SITE_KEY=${{ secrets.TURNSTILE_SITE_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push backend
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/iam-dynamic-backend:latest
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/iam-dynamic-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push caddy
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.caddy
          push: true
          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/iam-dynamic-caddy:latest
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/iam-dynamic-caddy:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Docker Hub publishing disabled
        if: steps.dockerhub.outputs.enabled != 'true'
        run: echo "DOCKERHUB_USERNAME/DOCKERHUB_TOKEN secrets not set — skipping Docker Hub publishing (GHCR remains active)."

  build-images:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [security, test]
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Frontend image
      - name: Frontend image metadata
        id: frontend-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push frontend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}
          build-args: |
            VITE_TURNSTILE_SITE_KEY=${{ secrets.TURNSTILE_SITE_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Backend image
      - name: Backend image metadata
        id: backend-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push backend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Caddy image
      - name: Caddy image metadata
        id: caddy-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.CADDY_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push caddy
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.caddy
          push: true
          tags: ${{ steps.caddy-meta.outputs.tags }}
          labels: ${{ steps.caddy-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Security scan — install trivy via apt repository
      - name: Install Trivy
        run: |
          sudo apt-get install -y wget apt-transport-https gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy
          trivy --version

      - name: Trivy scan frontend
        run: trivy image --severity CRITICAL,HIGH --exit-code 0 ${{ env.FRONTEND_IMAGE }}:latest
        continue-on-error: true

      - name: Trivy scan backend
        run: trivy image --severity CRITICAL,HIGH --exit-code 0 ${{ env.BACKEND_IMAGE }}:latest
        continue-on-error: true

      - name: Trivy scan caddy
        run: trivy image --severity CRITICAL,HIGH --exit-code 0 ${{ env.CADDY_IMAGE }}:latest
        continue-on-error: true

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-images
    if: github.ref == 'refs/heads/main'
    outputs:
      deployed: ${{ steps.gate.outputs.deployed }}
    steps:
      - uses: actions/checkout@v6

      # Gate on the SSH secrets (via env, never interpolated) so the run
      # stays green — with an explicit skip message — until production
      # credentials are configured.
      - name: Check production SSH credentials
        id: gate
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          if [[ -n "$PROD_HOST" && -n "$PROD_USER" && -n "$PROD_SSH_KEY" ]]; then
            echo "deployed=true" >> "$GITHUB_OUTPUT"
          else
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            echo "PROD_HOST/PROD_USER/PROD_SSH_KEY secrets not set — skipping production deploy."
          fi

      - name: Deploy via SSH
        if: steps.gate.outputs.deployed == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/iam-dynamic
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            echo "Waiting for health checks..."
            sleep 10
            docker compose -f docker-compose.prod.yml exec -T frontend wget -qO- http://localhost:8080/nginx-health || exit 1
            docker compose -f docker-compose.prod.yml exec -T frontend wget -qO- http://localhost:8080/health || exit 1
            echo "Deployment healthy"

      - name: Production deploy skipped
        if: steps.gate.outputs.deployed != 'true'
        run: echo "No production SSH secrets configured; images were built and pushed to GHCR only."

  cleanup:
    name: Cleanup
    runs-on: ubuntu-latest
    needs: deploy
    if: always() && needs.deploy.outputs.deployed == 'true'
    steps:
      - name: Remove old frontend images
        uses: actions/delete-package-versions@v5
        with:
          package-name: iam-dynamic-frontend
          package-type: container
          min-versions-to-keep: 3
        continue-on-error: true

      - name: Remove old backend images
        uses: actions/delete-package-versions@v5
        with:
          package-name: iam-dynamic-backend
          package-type: container
          min-versions-to-keep: 3
        continue-on-error: true

      - name: Remove old caddy images
        uses: actions/delete-package-versions@v5
        with:
          package-name: iam-dynamic-caddy
          package-type: container
          min-versions-to-keep: 3
        continue-on-error: true

      - name: Slack notification
        uses: slackapi/slack-github-action@v2.1.0
        continue-on-error: true
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "IAM-Dynamic deployed successfully :rocket:\nCommit: ${{ github.sha }}\nBy: ${{ github.actor }}"
            }
